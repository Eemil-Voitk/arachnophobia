[mod-name]
arachnophobia=Araknofobi

[mod-description]
arachnophobia=Gir konfigurasjonsalternativer for å gjøre Eddertron spillbar for spillere med araknofobi. Som standard skjules beina på Eddertron, og laserpekere vises hvor føttene hadde vært. Inkluderer nye alternativer for å tilpasse fargen på øynene, antallet øyne og lys, samt å endre antallet bein, slik at spillere kan fjerne opptil seks bein som et alternativ til å gjøre dem usynlige.

[mod-setting-name]
arachnophobia-number-of-legs=Antall bein

arachnophobia-leg-visibility=Visningsstil for bein
arachnophobia-display-dust-particles=Vis støvpartikler
arachnophobia-mute-legs=Demp bein
arachnophobia-mute-feet=Demp føtter

arachnophobia-eyes-color=Øyefarge
arachnophobia-eyes-primary=Tenn primære øyne
arachnophobia-eyes-secondary=Tenn sekundære øyne
arachnophobia-eyes-tertiary=Tenn tertiære øyne
arachnophobia-eyes-back=Tenn øyne på skallet

arachnophobia-replace-icons=Erstatt ikoner

[mod-setting-description]
arachnophobia-number-of-legs=Setter antall bein på Eddertron til mellom 2 og 8.\n\n[color=#9cdcfe]Standard: 8[/color]

arachnophobia-leg-visibility=Bestemmer hvordan beina vises.\n\n[font=default-semibold]Skjult[/font] skjuler beina og gjør Eddertron til et svevende hode.\n[font=default-semibold]Laserpekere[/font] skjuler beina og viser et laserpekerpunkt i stedet for føttene.\n[font=default-semibold]Synlige[/font] beholder beina som de er, for når du endrer antall bein.\n\n[color=#9cdcfe]Standard: Laserpekere[/color]
arachnophobia-display-dust-particles=Eddertron lager støvpartikler der de usynlige føttene berører bakken.\n\n[color=#9cdcfe]Standard[/color]: [color=red]Deaktivert[/color]
arachnophobia-mute-legs=Demper lydene av beina som beveger seg.\n\n[color=#9cdcfe]Standard[/color]: [color=green]Aktivert[/color]
arachnophobia-mute-feet=Demper fottrinnene når Eddertron går.\n\n[color=#9cdcfe]Standard[/color]: [color=green]Aktivert[/color]

arachnophobia-eyes-color=Bestemmer fargen på øynene.\n\n[color=#9cdcfe]Standard[/color]: [color=#ff0800]Rød[/color]
arachnophobia-eyes-primary=Lyser opp følgende lys:\n[img=arachnophobia-light-guide-primary-1][img=arachnophobia-light-guide-primary-2][img=arachnophobia-light-guide-primary-3]\n[img=arachnophobia-light-guide-primary-4][img=arachnophobia-light-guide-primary-5][img=arachnophobia-light-guide-primary-6]\n[img=arachnophobia-light-guide-primary-7][img=arachnophobia-light-guide-primary-8][img=arachnophobia-light-guide-primary-9]\n\n[color=#9cdcfe]Standard[/color]: [color=green]Aktivert[/color]
arachnophobia-eyes-secondary=Lyser opp følgende lys:\n[img=arachnophobia-light-guide-secondary-1][img=arachnophobia-light-guide-secondary-2][img=arachnophobia-light-guide-secondary-3]\n[img=arachnophobia-light-guide-secondary-4][img=arachnophobia-light-guide-secondary-5][img=arachnophobia-light-guide-secondary-6]\n[img=arachnophobia-light-guide-secondary-7][img=arachnophobia-light-guide-secondary-8][img=arachnophobia-light-guide-secondary-9]\n\n[color=#9cdcfe]Standard[/color]: [color=green]Aktivert[/color]
arachnophobia-eyes-tertiary=Lyser opp følgende lys:\n[img=arachnophobia-light-guide-tertiary-1][img=arachnophobia-light-guide-tertiary-2][img=arachnophobia-light-guide-tertiary-3]\n[img=arachnophobia-light-guide-tertiary-4][img=arachnophobia-light-guide-tertiary-5][img=arachnophobia-light-guide-tertiary-6]\n[img=arachnophobia-light-guide-tertiary-7][img=arachnophobia-light-guide-tertiary-8][img=arachnophobia-light-guide-tertiary-9]\n\n[color=#9cdcfe]Standard[/color]: [color=green]Aktivert[/color]
arachnophobia-eyes-back=Lyser opp følgende lys:\n[img=arachnophobia-light-guide-back-1][img=arachnophobia-light-guide-back-2][img=arachnophobia-light-guide-back-3]\n[img=arachnophobia-light-guide-back-4][img=arachnophobia-light-guide-back-5][img=arachnophobia-light-guide-back-6]\n[img=arachnophobia-light-guide-back-7][img=arachnophobia-light-guide-back-8][img=arachnophobia-light-guide-back-9]\n\n[color=#9cdcfe]Standard[/color]: [color=green]Aktivert[/color]

arachnophobia-replace-icons=Bruker et bilde av en søt stein med "Rullende øyne" (Googly Eyes) for gjenstands- og teknologikonene.\n\nDette er et midlertidig alternativ i påvente av at hele settet med teknologi- og gjenstandsikoner blir ferdigstilt...\n\n[color=#9cdcfe]Standard[/color]: [color=red]Deaktivert[/color]

